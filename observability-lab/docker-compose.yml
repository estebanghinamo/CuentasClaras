name: cuentasclaras-observability-lab

services:
  sloth:
    # No hay tags semánticos recientes en Docker Hub para esta imagen; "latest"
    # es aceptable para un lab de estudio. Si necesitás reproducibilidad
    # estricta, pinneá un hash de commit de https://hub.docker.com/r/slok/sloth/tags
    image: slok/sloth:latest
    volumes:
      - ./sloth:/sloth
      - ./prometheus:/out
    command: >
      generate
      -i /sloth/login-slo.yaml
      -o /out/sloth-rules.yaml
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      sloth:
        condition: service_completed_successfully
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.3.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
