global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "sloth-rules.yaml"

scrape_configs:
  - job_name: "cuentasclaras-backend"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
