<h2 mat-dialog-title>Agregar sección</h2>

<mat-dialog-content class="cc-stack">
  <p class="cc-caption">Elegí qué otras secciones querés ver en el menú de este espacio.</p>

  <div class="cc-section-grid">
    @for (section of sections; track section.code) {
      <button
        type="button"
        class="cc-section-tile"
        [class.is-selected]="selected()[section.code]"
        (click)="toggle(section.code)"
      >
        <span class="cc-section-tile__check material-symbols-outlined">check_circle</span>
        <span class="cc-section-tile__icon material-symbols-outlined">{{ section.icon }}</span>
        <span class="cc-section-tile__label">{{ section.label }}</span>
      </button>
    }
  </div>

  @if (apiError()) {
    <div class="cc-banner cc-banner--danger">
      <span class="material-symbols-outlined">error</span>
      <span class="cc-banner__text">{{ apiError()?.error?.message }}</span>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving()" (click)="submit()">
    @if (saving()) {
      <app-spinner [size]="20" />
    } @else {
      Guardar
    }
  </button>
</mat-dialog-actions>
