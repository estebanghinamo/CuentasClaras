<h2 mat-dialog-title>Crear servicio desde sugerencia</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="cc-stack">
    <p class="cc-caption">
      Detectamos {{ data.suggestion.occurrences }} meses seguidos de "{{ data.suggestion.description }}" con un promedio de
      {{ data.suggestion.avg_amount | number: '1.2-2' }}. Revisá los datos antes de crear el servicio.
    </p>

    <app-service-fields-form [form]="form" [fieldError]="serverFieldError" />
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <app-spinner [size]="20" />
      } @else {
        Crear servicio
      }
    </button>
  </mat-dialog-actions>
</form>
