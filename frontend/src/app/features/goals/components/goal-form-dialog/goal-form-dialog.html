<h2 mat-dialog-title>{{ data.goal ? 'Editar meta' : 'Nueva meta de ahorro' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="cc-stack">
    <mat-form-field class="cc-form__full" appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" maxlength="150" />
      @if (serverFieldError('name'); as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Monto objetivo</mat-label>
      <input matInput type="number" step="0.01" min="0.01" inputmode="decimal" formControlName="target_amount" />
      @if (serverFieldError('target_amount'); as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha límite (opcional)</mat-label>
      <input matInput [matDatepicker]="dueDatePicker" [min]="minDate" formControlName="due_date" readonly (click)="dueDatePicker.open()" />
      <mat-datepicker-toggle matIconSuffix [for]="dueDatePicker" />
      <mat-datepicker #dueDatePicker />
      @if (serverFieldError('due_date'); as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <app-spinner [size]="20" />
      } @else {
        Guardar
      }
    </button>
  </mat-dialog-actions>
</form>
