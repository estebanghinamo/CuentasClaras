<app-auth-layout title="Recuperar contraseña">
  @if (sent()) {
    <div class="cc-banner cc-banner--success">
      <span class="material-symbols-outlined">mail</span>
      <span class="cc-banner__text">
        Si el email existe, te enviamos un enlace para elegir una nueva contraseña.
      </span>
    </div>
  } @else {
    <p class="cc-caption">Ingresá tu email y te mandamos un enlace para elegir una nueva contraseña.</p>

    <form class="cc-form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field class="cc-form__full" appearance="outline">
        <mat-label>Email</mat-label>
        <span class="material-symbols-outlined" matPrefix>mail</span>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <div class="cc-form__full cc-form__actions cc-form__actions--center">
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <app-spinner [size]="20" />
          } @else {
            Enviar enlace
          }
        </button>
      </div>
    </form>
  }

  <div class="cc-auth__links">
    <a routerLink="/auth/login">Volver a iniciar sesión</a>
  </div>
</app-auth-layout>
