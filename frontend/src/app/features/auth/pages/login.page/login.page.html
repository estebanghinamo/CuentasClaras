<app-auth-layout title="Bienvenido de nuevo" subtitle="Ingresá para ver tus finanzas">
  <form class="cc-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (errorMessage()) {
      <div class="cc-form__full cc-banner cc-banner--danger">
        <span class="material-symbols-outlined">error</span>
        <span class="cc-banner__text">{{ errorMessage() }}</span>
      </div>
    }

    <mat-form-field class="cc-form__full" appearance="outline">
      <mat-label>Email</mat-label>
      <span class="material-symbols-outlined" matPrefix>mail</span>
      <input matInput type="email" formControlName="email" autocomplete="email" />
    </mat-form-field>

    <mat-form-field class="cc-form__full" appearance="outline">
      <mat-label>Contraseña</mat-label>
      <span class="material-symbols-outlined" matPrefix>lock</span>
      <input matInput [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <span class="material-symbols-outlined">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </mat-form-field>

    <div class="cc-form__full cc-form__actions cc-form__actions--center">
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <app-spinner [size]="20" />
        } @else {
          Iniciar sesión
        }
      </button>
    </div>
  </form>

  <div class="cc-auth__links">
    <a routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>
    <span class="cc-auth__links-divider">·</span>
    <a routerLink="/auth/register">Crear una cuenta</a>
  </div>
</app-auth-layout>
