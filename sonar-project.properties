sonar.projectKey=estebanghinamo_CuentasClaras
sonar.organization=estebanghinamo

# Backend: Laravel 12 (PHP). Frontend: Angular 20 (TypeScript/HTML/SCSS).
sonar.sources=backend/app,backend/routes,backend/config,backend/database,frontend/src
sonar.tests=backend/tests,frontend/src

sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/.angular/**,**/storage/**,**/bootstrap/cache/**,**/android/**,**/coverage/**
sonar.test.inclusions=backend/tests/**/*.php,frontend/src/**/*.spec.ts

sonar.sourceEncoding=UTF-8

# Cobertura: reportes generados en CI (ver .github/workflows/ci.yml) y
# descargados como artifacts antes de correr el scanner.
sonar.php.coverage.reportPaths=backend/coverage/clover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info
